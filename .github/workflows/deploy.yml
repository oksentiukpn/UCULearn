name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: oksesaneka22/uculearn:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Get EC2 IP Address
        id: get-ip
        run: |
          SERVER_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=uculearn" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)

          echo "Found IP: $SERVER_IP"
          echo "EC2_IP=$SERVER_IP" >> $GITHUB_ENV

      - name: SSH into EC2 and restart Quadlet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_IP }}
          username: fedora
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            podman pull docker.io/oksesaneka22/uculearn:latest
            systemctl --user restart app.service
